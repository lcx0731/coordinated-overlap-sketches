[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinated-overlap-sketches"
version = "0.1.0"
description = "Mergeable bottom-k distinct and intersection estimates with explicit sampling and hash limits."
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8,<9", "numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.scripts]
overlap-sketch = "overlap_sketch.cli:main"
overlap-sketch-demo = "overlap_sketch.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-ra"
